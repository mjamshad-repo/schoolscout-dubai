<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin · Dubai School Fees</title>
<style>
:root{--bg:#f7f5f0;--surface:#fff;--ink:#17201f;--muted:#5b6563;--accent:#0b6e6e;--line:#e2ddd2;--bad:#b3261e;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#121716;--surface:#1a2120;--ink:#e9eeec;--muted:#a4aeab;--accent:#5cc7c0;--line:#2a3331;--bad:#ff8a80}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1100px;margin:0 auto;padding:20px 16px 48px}h1{font-size:1.5rem;margin:0 0 4px}h2{font-size:1.05rem;margin:24px 0 8px}
.muted{color:var(--muted)}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,button{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
button{cursor:pointer;background:var(--accent);color:#fff;border-color:var(--accent)}button.ghost{background:var(--surface);color:var(--accent)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}.tile b{display:block;font-size:1.5rem}
.wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:.88rem}th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;white-space:nowrap}td.q{min-width:260px}td.a{max-width:420px;color:var(--muted)}
.bars div{display:flex;gap:8px;align-items:center;margin:3px 0}.bars span:first-child{width:200px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:10px;background:var(--accent);border-radius:5px}.err{color:var(--bad)}details summary{cursor:pointer;color:var(--accent)}
</style>
</head>
<body>
<main>
  <h1>Dubai School Fees · Admin</h1>
  <p class="muted">Private. Questions are stored anonymously (no IP addresses).</p>
  <form id="login" class="row">
    <input id="pw" type="password" placeholder="Admin password" autocomplete="current-password" required>
    <select id="days"><option value="1">Today</option><option value="7" selected>Last 7 days</option><option value="30">Last 30 days</option><option value="365">Last 12 months</option></select>
    <button>Load</button>
    <button type="button" class="ghost" id="csv">Download CSV</button>
  </form>
  <p id="msg" class="err"></p>
  <div id="out"></div>
</main>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
try{ $("#pw").value=sessionStorage.getItem("adm")||""; }catch{}
const get=(view)=>fetch(`/api/admin?view=${view}&days=${$("#days").value}`,{headers:{"x-admin-key":$("#pw").value}});
function table(rows){
  if(!rows.length) return '<p class="muted">Nothing yet.</p>';
  return `<div class="wrap"><table><tr><th>When (UTC)</th><th>Question</th><th>Answered by</th><th>Area</th><th>Time</th><th>Vote</th><th>Answer</th></tr>${rows.map(r=>`<tr>
    <td>${esc(r.at.replace("T"," ").slice(0,16))}</td><td class="q">${esc(r.question)}${r.turn>1?` <span class="muted">(follow-up)</span>`:""}</td>
    <td>${esc(r.provider)}</td><td>${esc(r.place||"")}${r.max_km?` ≤${r.max_km} km`:""}</td><td>${r.ms?(r.ms/1000).toFixed(1)+" s":""}</td>
    <td>${r.vote===1?"👍":r.vote===-1?"👎":""}</td><td class="a"><details><summary>Show</summary>${esc(r.answer)}</details></td></tr>`).join("")}</table></div>`;
}
function bars(items,label){ const max=Math.max(1,...items.map(i=>i.n));
  return `<div class="bars">${items.map(i=>`<div><span title="${esc(i[label])}">${esc(i[label]??"(none)")}</span><span class="bar" style="width:${Math.round(i.n/max*300)}px"></span><span>${i.n}</span></div>`).join("")||'<p class="muted">Nothing yet.</p>'}</div>`; }
async function load(e){
  e?.preventDefault(); $("#msg").textContent=""; $("#out").innerHTML='<p class="muted">Loading…</p>';
  try{ sessionStorage.setItem("adm",$("#pw").value); }catch{}
  const [s,recent,bad]=await Promise.all(["summary","recent","bad"].map(v=>get(v).then(r=>r.json())));
  if(s.error){ $("#out").innerHTML=""; $("#msg").textContent=s.error; return; }
  const t=s.totals||{};
  $("#out").innerHTML=`<div class="tiles">
    <div class="tile"><b>${t.n||0}</b>questions</div><div class="tile"><b>${s.aiCallsToday}</b>AI calls today</div>
    <div class="tile"><b>${t.up||0} / ${t.down||0}</b>👍 / 👎</div><div class="tile"><b>${t.avg_ms?(t.avg_ms/1000).toFixed(1)+" s":"–"}</b>average answer time</div></div>
    <h2>Questions per day</h2>${bars(s.byDay,"day")}
    <h2>Answered by</h2><p class="muted">gemini:/groq:/cloudflare: = AI model · rules = fixed reply · cache = repeated question · search:* = AI busy or daily cap reached</p>${bars(s.byProvider,"provider")}
    <h2>Most asked areas</h2>${bars(s.places,"place")}
    <h2>Needs attention (👎 or no AI answer)</h2>${table(bad.rows||[])}
    <h2>Latest 100 questions</h2>${table(recent.rows||[])}`;
}
$("#login").addEventListener("submit",load);
$("#csv").onclick=async()=>{ const r=await get("csv"); if(!r.ok){ $("#msg").textContent=(await r.json()).error; return; }
  const a=document.createElement("a"); a.href=URL.createObjectURL(await r.blob()); a.download=`questions-last-${$("#days").value}-days.csv`; a.click(); };
if($("#pw").value) load();
</script>
</body>
</html>
